<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Sentimental IA – Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>

  <body>
    <!-- HEADER GLOBAL (reutilizar en TODAS las páginas) -->
    <header class="topbar">
      <div class="topbar-left">H12-25-L-Equipo 68</div>

      <nav class="topbar-center" aria-label="Navegación principal">
        <ul class="nav-links">
          <li><a href="/index.html" class="nav-link" data-nav="inicio">Inicio</a></li>
          <li><a href="/dashboard.html" class="nav-link" data-nav="dashboard">Dashboard</a></li>
          <li><a href="/estadisticas.html" class="nav-link" data-nav="estadisticas">Estadísticas</a></li>
          <li><a href="/docs.html" class="nav-link" data-nav="docs">Docs</a></li>
          <li><a href="/recursos.html" class="nav-link" data-nav="recursos">Recursos</a></li>
        </ul>
      </nav>

      <!-- DERECHA (mismo nivel del menú, alineado a la derecha) -->
      <div class="topbar-right">
        <button
          type="button"
          id="themeToggle"
          class="btn-theme"
          aria-label="Cambiar tema"
          title="Cambiar tema"
        >
          ☾
        </button>

        <button type="button" class="btn-login">Iniciar sesión</button>
      </div>
    </header>

    <!-- CONTENIDO -->
    <main class="page">
      <section class="hero">
        <h1 class="branding-title">Sentimental IA</h1>
        <h2 class="branding-subtitle">Análisis inteligente de comentarios</h2>
      </section>

      <section class="conversation" id="inicio">
        <div id="history" class="history"></div>

        <!-- Selector de idioma (obligatorio antes de escribir) -->
        <div class="language-selector" id="languageSelector">
          <label for="langSelect">Selecciona el idioma del comentario:</label>
          <select id="langSelect" required>
            <option value="">-- Selecciona un idioma --</option>
            <option value="es">Español</option>
            <option value="pt">Portugués</option>
          </select>
        </div>

        <section class="input-area">
          <div class="input-wrapper">
            <textarea
              id="textInput"
              class="search-input"
              placeholder="Selecciona un idioma primero, luego escribe tu comentario..."
              rows="3"
              spellcheck="true"
              autocomplete="off"
              disabled
            ></textarea>

            <button
              type="button"
              id="attachButton"
              class="input-action input-attach"
              aria-label="Adjuntar archivo"
            >
              +
            </button>

            <button
              type="button"
              id="clearButton"
              class="input-action input-clear hidden"
              aria-label="Limpiar texto"
            >
              ×
            </button>

            <button
              type="button"
              id="sendButton"
              class="input-action input-send hidden"
              aria-label="Analizar sentimiento"
            >
              ↑
            </button>
          </div>
        </section>
      </section>
    </main>

    <!-- 
      CONFIGURACIÓN DEL API (opcional):
      Si necesitas cambiar la URL del Backend, descomenta y modifica:
      <script>
        window.__SENTIMENTAL_API_BASE__ = "http://tu-backend-url:8000";
      </script>
      
      NOTA SOBRE CORS:
      Si ves errores de CORS, verifica que el Backend tenga configurado:
      @CrossOrigin(origins = {"http://localhost:3000", "http://localhost:80", "*"})
      
      Para Docker, el Backend debe permitir el origen desde donde se accede al frontend.
    -->
    <script src="/assets/js/app.js"></script>
  </body>
</html>
