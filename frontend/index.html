<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Sentimental IA – Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-root">
    <!-- Barra superior con menú centrado y toggle de tema -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          Sentimental IA · Equipo 68
        </div>

        <nav class="topbar-center">
          <a href="#inicio" class="nav-link">Inicio</a>
          <a href="#dashboard" class="nav-link">Dashboard</a>
          <a href="#estadisticas" class="nav-link">Estadísticas</a>
          <a href="#docs" class="nav-link">Docs</a>
          <a href="#recursos" class="nav-link">Recursos</a>
        </nav>

        <div class="topbar-right">
          <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">
            🌙
          </button>
        </div>
      </div>
    </header>

    <!-- Contenido principal -->
    <main class="main" id="inicio">
      <!-- Título y subtítulo centrados -->
      <section class="hero">
        <h1 class="branding-title">Sentimental IA</h1>
        <p class="branding-subtitle">Análisis Inteligente</p>
      </section>

      <!-- SOLO el textInput “envolverlo” visualmente -->
      <section class="input-area">
        <div class="input-wrapper">
          <textarea
            id="textInput"
            class="search-input"
            rows="3"
            placeholder="Haz tu comentario..."
          ></textarea>

          <!-- Icono + (adjuntar) en esquina inferior izquierda -->
          <button
            type="button"
            id="attachButton"
            class="input-action input-attach"
            aria-label="Adjuntar archivo"
          >
            +
          </button>

          <!-- Icono X (borrar) sobre la flecha, aparece con 1+ caracteres -->
          <button
            type="button"
            id="clearButton"
            class="input-action input-clear hidden"
            aria-label="Borrar comentario"
          >
            ✕
          </button>

          <!-- Icono ↑ (enviar/analizar), aparece con 1+ caracteres -->
          <button
            type="button"
            id="sendButton"
            class="input-action input-send hidden"
            aria-label="Analizar sentimiento"
            onclick="analyze()"
          >
            ↑
          </button>
        </div>

        <!-- Resultado, centrado debajo del input -->
        <div id="result" class="result hidden"></div>
      </section>
    </main>

    <footer class="footer">
      <p class="footer-text">
        Sentimental IA · Hackathon Oracle Next Education · Equipo 68
      </p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
