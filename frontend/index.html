<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Sentimental IA – Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      H12-25-L-Equipo 68
    </div>

    <nav class="topbar-center">
      <ul class="nav-links">
        <li><a href="#inicio" class="nav-link active">Inicio</a></li>
        <li><a href="#dashboard" class="nav-link">Dashboard</a></li>
        <li><a href="#estadisticas" class="nav-link">Estadísticas</a></li>
        <li><a href="#docs" class="nav-link">Docs</a></li>
        <li><a href="#recursos" class="nav-link">Recursos</a></li>
      </ul>
    </nav>

    <div class="topbar-right">
      <button type="button" class="btn-login">Iniciar sesión</button>
    </div>
  </header>

  <main class="page">
    <!-- Hero inicial (se oculta después del primer envío) -->
    <section class="hero">
      <h1 class="branding-title">Sentimental IA</h1>
      <h2 class="branding-subtitle">Análisis Inteligente</h2>
    </section>

    <section class="conversation" id="inicio">
      <!-- Historial de mensajes (usuario + respuesta) -->
      <div id="history" class="history"></div>

      <!-- Área de entrada -->
      <section class="input-area">
        <div class="input-wrapper">
          <textarea
            id="textInput"
            class="search-input"
            placeholder="Haz tu comentario..."
            rows="3"
          ></textarea>

          <!-- Icono (+) adjuntar -->
          <button
            type="button"
            id="attachButton"
            class="input-action input-attach"
            aria-label="Adjuntar archivo"
          >
            +
          </button>

          <!-- Selector de idioma ES/PT -->
          <select
            id="langSelect"
            class="input-action input-lang"
            aria-label="Seleccionar idioma"
          >
            <option value="es">ES</option>
            <option value="pt">PT</option>
          </select>

          <!-- Botón limpiar (X) -->
          <button
            type="button"
            id="clearButton"
            class="input-action input-clear hidden"
            aria-label="Limpiar texto"
          >
            ×
          </button>

          <!-- Botón enviar (flecha ↑) -->
          <button
            type="button"
            id="sendButton"
            class="input-action input-send hidden"
            aria-label="Analizar sentimiento"
          >
            ↑
          </button>
        </div>
      </section>
    </section>

    <!-- Anclas vacías solo para que el menú no pierda links -->
    <section id="dashboard"></section>
    <section id="estadisticas"></section>
    <section id="docs"></section>
    <section id="recursos"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
